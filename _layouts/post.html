---
layout: default
---
<article class="row post">
{% if page.image %}<div class="post__hero"><img src="{{ page.image }}" alt="{{ page.image_alt | default: page.title | escape }}" /></div>{% endif %}
<p class="post__meta"><a href="/updates/">&larr; Updates</a> <span>&middot;</span> <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
<h1 class="post__title">{{ page.title }}</h1>
<div class="post__body">
{{ content }}
</div>
</article>
