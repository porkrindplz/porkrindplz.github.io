<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png" />
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}" />
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
<meta property="og:site_name" content="Levity Cube" />
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta property="og:description" content="{{ page.description | default: site.description }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:image" content="{{ page.image | default: '/images/og/home.jpg' | absolute_url }}" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />
<link rel="stylesheet" href="/assets/css/base.css" />
<link rel="stylesheet" href="/assets/css/studio-editorial.css" />
<link rel="stylesheet" href="/assets/css/updates.css" />
{% feed_meta %}
